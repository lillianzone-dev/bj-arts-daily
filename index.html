function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++){a[i]=parseInt(h.substr(i*2,2),16);}return a;}
function b64ToBytes(b){var s=atob(b);var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++){a[i]=s.charCodeAt(i);}return a;}
async function sha256hex(str){var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");}
async function unlock(){
  var pw=document.getElementById("pw").value;
  if(!pw){return;}
  try{
    var keyHex=await sha256hex(SALT+pw);
    var key=await crypto.subtle.importKey("raw",hexToBytes(keyHex),{name:"AES-CBC"},false,["decrypt"]);
    var plain=await crypto.subtle.decrypt({name:"AES-CBC",iv:hexToBytes(IV)},key,b64ToBytes(PAYLOAD));
    var html=new TextDecoder().decode(plain);
    document.open();
    document.write("<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"robots\" content=\"noindex,nofollow\"><title>北京双语及国际化学校 · 艺术项目与招生动态</title></head><body>"+html+"</body></html>");
    document.close();
  }catch(e){
    document.getElementById("err").style.display="block";
    document.getElementById("pw").value="";
    document.getElementById("pw").focus();
  }
}
document.getElementById("btn").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter"){unlock();}});
document.getElementById("pw").focus();
</script>
